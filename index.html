<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="公開中・開発中のアプリをまとめたポートフォリオサイト">
  <meta name="theme-color" content="#0a1020">
  <title>App Shelf — アプリ一覧</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#" aria-label="App Shelf ホーム">
      <span class="brand-mark" aria-hidden="true">A</span>
      <span>アプリ置き場</span>
    </a>
  </header>

  <main>
    <section class="hero">
      <p class="eyebrow">つくったアプリ</p>
      <h1>アプリをまとめています。</h1>
      <p class="hero-copy">公開しているものから、まだ開発途中のものまで。気になるアプリがあれば、カードから詳しく見ることができます。</p>
      <div class="summary" aria-label="アプリ集計">
        <div><strong id="totalCount">0</strong><span>すべて</span></div>
        <div><strong id="releasedCount">0</strong><span>公開中</span></div>
        <div><strong id="developingCount">0</strong><span>開発中</span></div>
      </div>
    </section>

    <section class="catalog" aria-labelledby="catalogTitle">
      <div class="catalog-heading">
        <div>
          <p class="section-number">アプリを探す</p>
          <h2 id="catalogTitle">アプリ一覧</h2>
        </div>
        <p id="resultCount" class="result-count" aria-live="polite"></p>
      </div>

      <div class="tools">
        <label class="search">
          <span aria-hidden="true">⌕</span>
          <input id="searchInput" type="search" placeholder="名前・説明・技術で検索" autocomplete="off">
        </label>
        <div class="filters" aria-label="公開状態で絞り込み">
          <button type="button" class="filter active" data-filter="all" aria-pressed="true">すべて</button>
          <button type="button" class="filter" data-filter="released" aria-pressed="false">公開中</button>
          <button type="button" class="filter" data-filter="developing" aria-pressed="false">開発中</button>
          <button type="button" class="filter" data-filter="planned" aria-pressed="false">構想中</button>
        </div>
      </div>

      <div id="appGrid" class="app-grid"></div>
      <div id="emptyState" class="empty-state" hidden>
        <span aria-hidden="true">◌</span>
        <h3>一致するアプリがありません</h3>
        <p>検索語や絞り込み条件を変えてみてください。</p>
      </div>
    </section>

    <section class="about" aria-labelledby="aboutTitle">
      <p class="section-number">このサイトについて</p>
      <div>
        <h2 id="aboutTitle">使いやすいものを、少しずつ。</h2>
        <p>日々の不便を減らすツールや、触っていて分かりやすい画面を中心に作っています。公開前のアプリも、進み具合に合わせてここへ追加していきます。</p>
      </div>
    </section>
  </main>

  <footer>
    <p>© <span id="year"></span> App Shelf</p>
    <a href="#">ページ上部へ ↑</a>
  </footer>

  <script src="apps.js"></script>
</body>
</html>
