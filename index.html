<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="公開中・開発中のアプリをまとめたポートフォリオサイト">
  <meta name="theme-color" content="#f7f7f3">
  <title>App Shelf — アプリ一覧</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#top" aria-label="App Shelf ホーム">
      <span class="brand-mark" aria-hidden="true">A</span>
      <span class="brand-name">アプリ置き場</span>
    </a>
    <a class="live-pill" href="#catalogTitle">
      <span class="live-dot" aria-hidden="true"></span>
      <span><strong id="releasedCount">0</strong> 個 公開中</span>
      <span class="live-arrow" aria-hidden="true">↓</span>
    </a>
  </header>

  <main id="top">
    <section class="intro">
      <h1>つくったアプリ、置いています。</h1>
      <p class="intro-copy">日々の不便を減らす小さな道具を作っています。公開中のものはその場ですぐ触れます。</p>
    </section>

    <section class="catalog" aria-labelledby="catalogTitle">
      <h2 id="catalogTitle" class="visually-hidden">アプリ一覧</h2>

      <div class="tools">
        <label class="search">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input id="searchInput" type="search" placeholder="名前・説明・技術で検索" autocomplete="off">
        </label>
        <div class="filters" aria-label="公開状態で絞り込み">
          <button type="button" class="filter active" data-filter="all" aria-pressed="true">すべて<span class="filter-count" id="countAll">0</span></button>
          <button type="button" class="filter is-released" data-filter="released" aria-pressed="false"><span class="dot" aria-hidden="true"></span>公開中<span class="filter-count" id="countReleased">0</span></button>
          <button type="button" class="filter" data-filter="developing" aria-pressed="false">開発中<span class="filter-count" id="countDeveloping">0</span></button>
          <button type="button" class="filter" data-filter="planned" aria-pressed="false">構想中<span class="filter-count" id="countPlanned">0</span></button>
        </div>
        <p id="resultCount" class="result-count" aria-live="polite"></p>
      </div>

      <div class="kind-tools" aria-label="使い方で絞り込み">
        <span class="kind-tools-label">使い方</span>
        <button type="button" class="kind-filter active" data-kind="all" aria-pressed="true">すべて</button>
        <button type="button" class="kind-filter kf-web" data-kind="web" aria-pressed="false"><span aria-hidden="true">🌐</span>ブラウザで動く<span class="filter-count" id="countWeb">0</span></button>
        <button type="button" class="kind-filter kf-download" data-kind="download" aria-pressed="false"><span aria-hidden="true">⬇</span>ダウンロードして使う<span class="filter-count" id="countDownload">0</span></button>
      </div>

      <div id="appGrid" class="app-grid"></div>
      <div id="emptyState" class="empty-state" hidden>
        <span aria-hidden="true">◌</span>
        <h3>一致するアプリがありません</h3>
        <p>検索語や絞り込み条件を変えてみてください。</p>
      </div>
    </section>
  </main>

  <footer>
    <p>© <span id="year"></span> App Shelf</p>
    <a href="#top">ページ上部へ <span aria-hidden="true">↑</span></a>
  </footer>

  <script src="apps.js"></script>
</body>
</html>
