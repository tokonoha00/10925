<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logo Shine Maker - ロゴに光が走るループ素材メーカー</title>
<style>
  :root {
    --bg: #16181d;
    --panel: #1f232b;
    --panel2: #262b35;
    --text: #e8eaf0;
    --sub: #9aa3b2;
    --accent: #ffd75e;
    --accent2: #6ee7a0;
    --border: #333a46;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Segoe UI", "Yu Gothic UI", "Meiryo", sans-serif;
    height: 100vh; display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    padding: 10px 18px; background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: baseline; gap: 14px;
  }
  header h1 { font-size: 17px; font-weight: 600; }
  header .desc { font-size: 12px; color: var(--sub); }
  main { flex: 1; display: flex; min-height: 0; }
  #panel {
    width: 300px; min-width: 300px; background: var(--panel);
    border-right: 1px solid var(--border); padding: 14px;
    overflow-y: auto; display: flex; flex-direction: column; gap: 14px;
  }
  .group {
    background: var(--panel2); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .group h2 { font-size: 12px; color: var(--sub); font-weight: 600; letter-spacing: 0.05em; }
  #dropzone {
    border: 2px dashed var(--border); border-radius: 8px;
    padding: 18px 10px; text-align: center; color: var(--sub);
    font-size: 12px; cursor: pointer; line-height: 1.7;
    transition: border-color 0.15s, background 0.15s;
  }
  #dropzone.hover { border-color: var(--accent); background: rgba(255,215,94,0.08); }
  #dropzone strong { color: var(--text); font-size: 13px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .row label { font-size: 12.5px; }
  .row .val { font-size: 12px; color: var(--accent); min-width: 46px; text-align: right; font-variant-numeric: tabular-nums; }
  input[type="range"] { width: 100%; accent-color: var(--accent); }
  select, input[type="color"] {
    background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 5px;
    padding: 4px 6px; font-size: 12.5px;
  }
  input[type="checkbox"] { accent-color: var(--accent); }
  .check { display: flex; align-items: center; gap: 7px; font-size: 12.5px; cursor: pointer; }
  button {
    background: var(--accent); color: #2b230a; border: none; border-radius: 6px;
    padding: 9px 12px; font-size: 13.5px; font-weight: 600; cursor: pointer;
    transition: filter 0.15s;
  }
  button:hover:not(:disabled) { filter: brightness(1.1); }
  button:disabled { opacity: 0.4; cursor: default; }
  button.secondary { background: var(--panel2); border: 1px solid var(--border); color: var(--text); }
  button.green { background: #2e9e63; color: #fff; }
  button.blue { background: #4f8cff; color: #fff; }
  #status { font-size: 12px; color: var(--sub); min-height: 17px; }
  #right { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #previewWrap {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 20px; min-height: 0; position: relative;
  }
  #preview {
    max-width: 100%; max-height: 100%;
    border: 1px solid var(--border); border-radius: 4px;
    background: repeating-conic-gradient(#3a4150 0% 25%, #2b303b 0% 50%) 0 0 / 20px 20px;
  }
  #emptyMsg { position: absolute; color: var(--sub); font-size: 14px; pointer-events: none; }
  #result {
    border-top: 1px solid var(--border); background: var(--panel);
    padding: 10px 18px; display: none; align-items: center; gap: 16px; max-height: 180px;
  }
  #result.show { display: flex; }
  #result img, #result video {
    max-height: 140px; max-width: 300px;
    border: 1px solid var(--border); border-radius: 4px;
    background: repeating-conic-gradient(#3a4150 0% 25%, #2b303b 0% 50%) 0 0 / 16px 16px;
  }
  #result .info { font-size: 12.5px; color: var(--sub); line-height: 1.8; }
  #result .info b { color: var(--accent2); }
  #result a { color: #4f8cff; }
</style>
</head>
<body>
<header>
  <h1>Logo Shine Maker</h1>
  <span class="desc">ロゴ・タイトル画像にキラッと光が走るループアニメを付けて GIF / MP4 / WebM / 連番PNG で書き出せます(サムネ・配信オーバーレイに)</span>
</header>
<main>
  <div id="panel">
    <div class="group">
      <h2>1. ロゴ画像を読み込む</h2>
      <div id="dropzone">
        <strong>クリックして画像を選択</strong><br>
        またはドラッグ&ドロップ / 貼り付け (Ctrl+V)<br>
        透過PNG推奨(白背景画像は自動透過)
      </div>
      <input type="file" id="fileInput" accept="image/*" hidden>
      <button class="secondary" id="sampleBtn">サンプルロゴで試す</button>
      <label class="check"><input type="checkbox" id="whiteToAlpha"> 白背景を透過にする</label>
    </div>

    <div class="group">
      <h2>2. 光の設定</h2>
      <div class="row">
        <label>モード</label>
        <select id="mode">
          <option value="sweep">光沢スイープ(白)</option>
          <option value="rainbow">虹色スイープ</option>
          <option value="holo">ホログラム(全体虹)</option>
        </select>
      </div>
      <div class="row"><label>角度</label><span class="val" id="angleVal">20°</span></div>
      <input type="range" id="angle" min="-80" max="80" step="5" value="20">
      <div class="row"><label>帯の幅</label><span class="val" id="bandVal">18%</span></div>
      <input type="range" id="band" min="5" max="60" step="1" value="18">
      <div class="row"><label>強さ</label><span class="val" id="intenVal">85%</span></div>
      <input type="range" id="inten" min="10" max="100" step="5" value="85">
      <div class="row"><label>ループ周期</label><span class="val" id="periodVal">2.5秒</span></div>
      <input type="range" id="period" min="1" max="6" step="0.5" value="2.5">
      <div class="row"><label>なめらかさ</label><span class="val" id="fpsVal">20fps</span></div>
      <input type="range" id="fps" min="8" max="30" step="1" value="20">
      <label class="check"><input type="checkbox" id="sparkle" checked> キラ粒子を散らす</label>
      <div class="row" id="sparkleRow"><label>粒子の数</label><span class="val" id="sparkleNVal">10</span></div>
      <input type="range" id="sparkleN" min="2" max="30" step="1" value="10">
    </div>

    <div class="group">
      <h2>3. 出力の設定</h2>
      <div class="row">
        <label>背景</label>
        <select id="bgMode">
          <option value="transparent">透過</option>
          <option value="white">白</option>
          <option value="black">黒</option>
          <option value="custom">カスタム色</option>
        </select>
      </div>
      <div class="row" id="bgColorRow" style="display:none">
        <label>背景色</label>
        <input type="color" id="bgColor" value="#ffffff">
      </div>
      <div class="row">
        <label>読込サイズ上限</label>
        <select id="maxSize">
          <option value="800">長辺 800px</option>
          <option value="0">元のサイズ</option>
          <option value="1280">長辺 1280px</option>
          <option value="480">長辺 480px</option>
        </select>
      </div>
    </div>

    <div class="group">
      <h2>4. 書き出し</h2>
      <button id="gifBtn" class="blue" disabled>GIF を書き出す</button>
      <button id="mp4Btn" class="green" disabled>MP4 動画を書き出す</button>
      <button id="webmBtn" class="green" disabled>WebM 動画を書き出す</button>
      <button id="zipBtn" class="secondary" disabled>連番PNG (ZIP) を書き出す</button>
      <div id="status"></div>
    </div>
  </div>

  <div id="right">
    <div id="previewWrap">
      <span id="emptyMsg">← ロゴを読み込むとここでプレビューが動きます</span>
      <canvas id="preview" style="display:none"></canvas>
    </div>
    <div id="result">
      <img id="resultImg" alt="書き出し結果">
      <video id="resultVideo" autoplay muted loop playsinline style="display:none"></video>
      <div class="info" id="resultInfo"></div>
    </div>
  </div>
</main>

<script src="gifenc.js"></script>
<script src="lib/gifenc-lib.js"></script>
<script src="lib/mp4-muxer.js"></script>
<script src="lib/jszip.min.js"></script>
<script src="exporter.js"></script>
<script>
"use strict";

let srcImage = null;
let srcCanvas = null;     // 前処理済みロゴ
let opaquePoints = [];    // キラ粒子の配置候補(不透明ピクセル)
let frames = [];
const $ = (id) => document.getElementById(id);
const preview = $("preview");
const pctx = preview.getContext("2d");

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---------- 画像読み込み ----------
function loadFile(file) {
  if (!file || !file.type.startsWith("image/")) return;
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    URL.revokeObjectURL(url);
    srcImage = img;
    autoDetectAlpha();
    rebuildSource();
  };
  img.onerror = () => { URL.revokeObjectURL(url); ExportKit.setStatus("画像を読み込めませんでした"); };
  img.src = url;
}

function autoDetectAlpha() {
  const c = document.createElement("canvas");
  const s = Math.min(1, 256 / Math.max(srcImage.width, srcImage.height));
  c.width = Math.max(1, Math.round(srcImage.width * s));
  c.height = Math.max(1, Math.round(srcImage.height * s));
  const x = c.getContext("2d", { willReadFrequently: true });
  x.drawImage(srcImage, 0, 0, c.width, c.height);
  const d = x.getImageData(0, 0, c.width, c.height).data;
  let hasAlpha = false;
  for (let i = 3; i < d.length; i += 40) {
    if (d[i] < 250) { hasAlpha = true; break; }
  }
  $("whiteToAlpha").checked = !hasAlpha;
}

function whiteToAlpha(imgData) {
  const d = imgData.data;
  for (let i = 0; i < d.length; i += 4) {
    const r = d[i], g = d[i + 1], b = d[i + 2];
    const a = Math.max(255 - r, 255 - g, 255 - b);
    if (a === 0) { d[i + 3] = 0; continue; }
    d[i]     = 255 - ((255 - r) * 255) / a;
    d[i + 1] = 255 - ((255 - g) * 255) / a;
    d[i + 2] = 255 - ((255 - b) * 255) / a;
    d[i + 3] = (d[i + 3] * a) / 255;
  }
}

function rebuildSource() {
  if (!srcImage) return;
  let w = srcImage.width, h = srcImage.height;
  const limit = parseInt($("maxSize").value, 10);
  if (limit > 0 && Math.max(w, h) > limit) {
    const s = limit / Math.max(w, h);
    w = Math.max(1, Math.round(w * s));
    h = Math.max(1, Math.round(h * s));
  }
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const x = c.getContext("2d", { willReadFrequently: true });
  x.imageSmoothingQuality = "high";
  x.drawImage(srcImage, 0, 0, w, h);
  const data = x.getImageData(0, 0, w, h);
  if ($("whiteToAlpha").checked) {
    whiteToAlpha(data);
    x.putImageData(data, 0, 0);
  }
  srcCanvas = c;
  // キラ粒子の配置候補: 不透明ピクセルを間引いて収集
  opaquePoints = [];
  const d = data.data;
  const step = Math.max(1, Math.floor(Math.sqrt((w * h) / 4000)));
  for (let y = 0; y < h; y += step) {
    for (let xx = 0; xx < w; xx += step) {
      if (d[(y * w + xx) * 4 + 3] > 200) opaquePoints.push([xx, y]);
    }
  }
  buildFrames();
}

// ---------- フレーム生成 ----------
function params() {
  return {
    mode: $("mode").value,
    angle: (parseFloat($("angle").value) * Math.PI) / 180,
    band: parseFloat($("band").value) / 100,
    inten: parseFloat($("inten").value) / 100,
    period: parseFloat($("period").value),
    fps: parseInt($("fps").value, 10),
    sparkle: $("sparkle").checked,
    sparkleN: parseInt($("sparkleN").value, 10),
  };
}

function rainbowStops(grad, offset, alpha) {
  const n = 12;
  for (let i = 0; i <= n; i++) {
    const hue = ((i / n) * 360 + offset * 360) % 360;
    grad.addColorStop(i / n, `hsla(${hue}, 95%, 65%, ${alpha})`);
  }
}

function buildFrames() {
  if (!srcCanvas) return;
  const p = params();
  const N = Math.min(150, Math.max(4, Math.round(p.period * p.fps)));
  const sw = srcCanvas.width, sh = srcCanvas.height;
  const margin = Math.ceil(Math.min(sw, sh) * 0.08) + 6; // キラ粒子用の余白
  const W = sw + margin * 2, H = sh + margin * 2;

  // スイープ軸: 角度方向に沿ってロゴを横切る
  const dirX = Math.cos(p.angle), dirY = Math.sin(p.angle);
  const diag = Math.abs(sw * dirX) + Math.abs(sh * dirY);
  const bandW = diag * p.band;

  // 粒子の配置と位相(全コマ共通)
  const rng = mulberry32(4242);
  const sparks = [];
  for (let i = 0; i < p.sparkleN && opaquePoints.length > 0; i++) {
    const pt = opaquePoints[Math.floor(rng() * opaquePoints.length)];
    sparks.push({
      x: pt[0] + margin, y: pt[1] + margin,
      phase: rng(),
      size: (0.5 + rng()) * Math.min(sw, sh) * 0.045,
    });
  }

  const overlay = document.createElement("canvas");
  overlay.width = W; overlay.height = H;
  const ox = overlay.getContext("2d");

  const newFrames = [];
  for (let f = 0; f < N; f++) {
    const t = f / N;
    const cv = document.createElement("canvas");
    cv.width = W; cv.height = H;
    const cx = cv.getContext("2d");
    cx.drawImage(srcCanvas, margin, margin);

    // --- 光のオーバーレイ(ロゴのアルファでマスク) ---
    ox.clearRect(0, 0, W, H);
    if (p.mode === "holo") {
      // 全体の虹色が流れる
      const g = ox.createLinearGradient(0, 0, W * dirX + 0.001, W * dirY + H * (dirY >= 0 ? 0 : -1));
      rainbowStops(g, t, p.inten * 0.5);
      ox.fillStyle = g;
      ox.fillRect(0, 0, W, H);
    } else {
      // 帯が走るスイープ: 中心位置が -bandW → diag+bandW を1周期で移動
      const c0 = -bandW + t * (diag + bandW * 2);
      const cxPos = W / 2 + (c0 - diag / 2) * dirX;
      const cyPos = H / 2 + (c0 - diag / 2) * dirY;
      const g = ox.createLinearGradient(
        cxPos - dirX * bandW, cyPos - dirY * bandW,
        cxPos + dirX * bandW, cyPos + dirY * bandW
      );
      if (p.mode === "rainbow") {
        g.addColorStop(0, "hsla(0, 95%, 65%, 0)");
        g.addColorStop(0.25, `hsla(${(t * 360) % 360}, 95%, 65%, ${p.inten})`);
        g.addColorStop(0.5, `hsla(${(t * 360 + 60) % 360}, 95%, 70%, ${p.inten})`);
        g.addColorStop(0.75, `hsla(${(t * 360 + 120) % 360}, 95%, 65%, ${p.inten})`);
        g.addColorStop(1, "hsla(0, 95%, 65%, 0)");
      } else {
        g.addColorStop(0, "rgba(255,255,255,0)");
        g.addColorStop(0.5, `rgba(255,255,255,${p.inten})`);
        g.addColorStop(1, "rgba(255,255,255,0)");
      }
      ox.fillStyle = g;
      ox.fillRect(0, 0, W, H);
    }
    // ロゴの形でマスク
    ox.globalCompositeOperation = "destination-in";
    ox.drawImage(srcCanvas, margin, margin);
    ox.globalCompositeOperation = "source-over";
    cx.drawImage(overlay, 0, 0);

    // --- キラ粒子(十字の星) ---
    if (p.sparkle) {
      for (const sp of sparks) {
        const tw = Math.max(0, Math.sin(2 * Math.PI * (t + sp.phase)));
        const a = Math.pow(tw, 4);
        if (a < 0.02) continue;
        const r = sp.size * (0.5 + a * 0.5);
        cx.save();
        cx.translate(sp.x, sp.y);
        cx.rotate(sp.phase * Math.PI);
        cx.strokeStyle = `rgba(255,255,255,${a})`;
        cx.lineWidth = Math.max(1.2, r * 0.16);
        cx.lineCap = "round";
        cx.beginPath();
        cx.moveTo(-r, 0); cx.lineTo(r, 0);
        cx.moveTo(0, -r); cx.lineTo(0, r);
        cx.stroke();
        cx.fillStyle = `rgba(255,255,255,${a})`;
        cx.beginPath();
        cx.arc(0, 0, r * 0.18, 0, Math.PI * 2);
        cx.fill();
        cx.restore();
      }
    }
    newFrames.push(cv);
  }
  frames = newFrames;
  preview.width = W;
  preview.height = H;
  preview.style.display = "";
  $("emptyMsg").style.display = "none";
  for (const id of ["gifBtn", "webmBtn", "zipBtn"]) $(id).disabled = false;
  if ("VideoEncoder" in window) $("mp4Btn").disabled = false;
  else $("mp4Btn").title = "このブラウザはWebCodecs非対応です";
  ExportKit.setStatus(`${W}×${H} / ${N}コマ(${p.period}秒ループ)生成完了`);
}

// ---------- プレビュー ----------
function currentBg() {
  const mode = $("bgMode").value;
  if (mode === "white") return [255, 255, 255];
  if (mode === "black") return [0, 0, 0];
  if (mode === "custom") {
    const hex = $("bgColor").value;
    return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
  }
  return null;
}

function tick(t) {
  if (frames.length > 0) {
    const fps = parseInt($("fps").value, 10);
    const idx = Math.floor((t / 1000) * fps) % frames.length;
    pctx.clearRect(0, 0, preview.width, preview.height);
    const bg = currentBg();
    if (bg) {
      pctx.fillStyle = `rgb(${bg[0]},${bg[1]},${bg[2]})`;
      pctx.fillRect(0, 0, preview.width, preview.height);
    }
    pctx.drawImage(frames[idx], 0, 0);
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

// ---------- サンプルロゴ ----------
function loadSample() {
  const c = document.createElement("canvas");
  c.width = 640; c.height = 240;
  const x = c.getContext("2d");
  x.font = '900 120px "Yu Gothic UI", "Meiryo", sans-serif';
  x.textAlign = "center";
  x.textBaseline = "middle";
  x.lineJoin = "round";
  x.strokeStyle = "#1d2f6f";
  x.lineWidth = 18;
  x.strokeText("推しロゴ", 320, 125);
  const g = x.createLinearGradient(0, 40, 0, 200);
  g.addColorStop(0, "#5f8dff");
  g.addColorStop(1, "#2a3f9e");
  x.fillStyle = g;
  x.fillText("推しロゴ", 320, 125);

  const img = new Image();
  img.onload = () => {
    srcImage = img;
    $("whiteToAlpha").checked = false;
    rebuildSource();
  };
  img.src = c.toDataURL();
}

// ---------- イベント ----------
function syncLabels() {
  $("angleVal").textContent = $("angle").value + "°";
  $("bandVal").textContent = $("band").value + "%";
  $("intenVal").textContent = $("inten").value + "%";
  $("periodVal").textContent = parseFloat($("period").value).toFixed(1) + "秒";
  $("fpsVal").textContent = $("fps").value + "fps";
  $("sparkleNVal").textContent = $("sparkleN").value;
}

$("dropzone").addEventListener("click", () => $("fileInput").click());
$("fileInput").addEventListener("change", (e) => loadFile(e.target.files[0]));
$("sampleBtn").addEventListener("click", loadSample);

const dz = $("dropzone");
document.addEventListener("dragover", (e) => { e.preventDefault(); dz.classList.add("hover"); });
document.addEventListener("dragleave", () => dz.classList.remove("hover"));
document.addEventListener("drop", (e) => {
  e.preventDefault();
  dz.classList.remove("hover");
  if (e.dataTransfer.files.length > 0) loadFile(e.dataTransfer.files[0]);
});
document.addEventListener("paste", (e) => {
  for (const item of e.clipboardData.items) {
    if (item.type.startsWith("image/")) { loadFile(item.getAsFile()); break; }
  }
});

let regenTimer = null;
for (const id of ["angle", "band", "inten", "period", "fps", "sparkleN"]) {
  $(id).addEventListener("input", () => {
    syncLabels();
    clearTimeout(regenTimer);
    regenTimer = setTimeout(buildFrames, 150);
  });
}
for (const id of ["mode", "sparkle"]) {
  $(id).addEventListener("change", buildFrames);
}
$("whiteToAlpha").addEventListener("change", rebuildSource);
$("maxSize").addEventListener("change", rebuildSource);
$("bgMode").addEventListener("change", () => {
  $("bgColorRow").style.display = $("bgMode").value === "custom" ? "" : "none";
});

$("gifBtn").addEventListener("click", () => ExportKit.exportGIF(frames, params().fps, currentBg()));
$("mp4Btn").addEventListener("click", () => ExportKit.exportMP4(frames, params().fps, currentBg()));
$("webmBtn").addEventListener("click", () => ExportKit.exportWebM(frames, params().fps, currentBg()));
$("zipBtn").addEventListener("click", () => ExportKit.exportZIP(frames, params().fps, currentBg()));
syncLabels();
</script>
</body>
</html>
