<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Idle Motion Maker - 立ち絵をゆらゆら動かすループ素材メーカー</title>
<style>
  :root {
    --bg: #16181d;
    --panel: #1f232b;
    --panel2: #262b35;
    --text: #e8eaf0;
    --sub: #9aa3b2;
    --accent: #ff8f5f;
    --accent2: #6ee7a0;
    --border: #333a46;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Segoe UI", "Yu Gothic UI", "Meiryo", sans-serif;
    height: 100vh; display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    padding: 10px 18px; background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: baseline; gap: 14px;
  }
  header h1 { font-size: 17px; font-weight: 600; }
  header .desc { font-size: 12px; color: var(--sub); }
  main { flex: 1; display: flex; min-height: 0; }
  #panel {
    width: 300px; min-width: 300px; background: var(--panel);
    border-right: 1px solid var(--border); padding: 14px;
    overflow-y: auto; display: flex; flex-direction: column; gap: 14px;
  }
  .group {
    background: var(--panel2); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .group h2 { font-size: 12px; color: var(--sub); font-weight: 600; letter-spacing: 0.05em; }
  #dropzone {
    border: 2px dashed var(--border); border-radius: 8px;
    padding: 18px 10px; text-align: center; color: var(--sub);
    font-size: 12px; cursor: pointer; line-height: 1.7;
    transition: border-color 0.15s, background 0.15s;
  }
  #dropzone.hover { border-color: var(--accent); background: rgba(255,143,95,0.08); }
  #dropzone strong { color: var(--text); font-size: 13px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .row label { font-size: 12.5px; }
  .row .val { font-size: 12px; color: var(--accent); min-width: 46px; text-align: right; font-variant-numeric: tabular-nums; }
  input[type="range"] { width: 100%; accent-color: var(--accent); }
  select, input[type="color"] {
    background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 5px;
    padding: 4px 6px; font-size: 12.5px;
  }
  input[type="checkbox"] { accent-color: var(--accent); }
  .check { display: flex; align-items: center; gap: 7px; font-size: 12.5px; cursor: pointer; }
  button {
    background: var(--accent); color: #21140d; border: none; border-radius: 6px;
    padding: 9px 12px; font-size: 13.5px; font-weight: 600; cursor: pointer;
    transition: filter 0.15s;
  }
  button:hover:not(:disabled) { filter: brightness(1.12); }
  button:disabled { opacity: 0.4; cursor: default; }
  button.secondary { background: var(--panel2); border: 1px solid var(--border); color: var(--text); }
  button.green { background: #2e9e63; color: #fff; }
  button.blue { background: #4f8cff; color: #fff; }
  .presets { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .presets button { padding: 7px 4px; font-size: 12px; }
  #status { font-size: 12px; color: var(--sub); min-height: 17px; }
  #right { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #previewWrap {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 20px; min-height: 0; position: relative;
  }
  #preview {
    max-width: 100%; max-height: 100%;
    border: 1px solid var(--border); border-radius: 4px;
    background: repeating-conic-gradient(#3a4150 0% 25%, #2b303b 0% 50%) 0 0 / 20px 20px;
  }
  #emptyMsg { position: absolute; color: var(--sub); font-size: 14px; pointer-events: none; }
  #result {
    border-top: 1px solid var(--border); background: var(--panel);
    padding: 10px 18px; display: none; align-items: center; gap: 16px; max-height: 180px;
  }
  #result.show { display: flex; }
  #result img, #result video {
    max-height: 140px; max-width: 300px;
    border: 1px solid var(--border); border-radius: 4px;
    background: repeating-conic-gradient(#3a4150 0% 25%, #2b303b 0% 50%) 0 0 / 16px 16px;
  }
  #result .info { font-size: 12.5px; color: var(--sub); line-height: 1.8; }
  #result .info b { color: var(--accent2); }
  #result a { color: #4f8cff; }
</style>
</head>
<body>
<header>
  <h1>Idle Motion Maker</h1>
  <span class="desc">立ち絵・マスコットPNGを読み込むだけで、浮遊・呼吸・ぷるぷる等の待機モーションループ素材を GIF / MP4 / WebM / 連番PNG で書き出せます</span>
</header>
<main>
  <div id="panel">
    <div class="group">
      <h2>1. 画像を読み込む</h2>
      <div id="dropzone">
        <strong>クリックして画像を選択</strong><br>
        またはドラッグ&ドロップ / 貼り付け (Ctrl+V)<br>
        透過PNG推奨(白背景画像は自動透過)
      </div>
      <input type="file" id="fileInput" accept="image/*" hidden>
      <button class="secondary" id="sampleBtn">サンプルキャラで試す</button>
      <label class="check"><input type="checkbox" id="whiteToAlpha"> 白背景を透過にする</label>
    </div>

    <div class="group">
      <h2>2. モーション(プリセット)</h2>
      <div class="presets">
        <button class="secondary" data-preset="fuwa">ふわふわ浮遊</button>
        <button class="secondary" data-preset="breath">のんびり呼吸</button>
        <button class="secondary" data-preset="puru">ぷるぷる</button>
        <button class="secondary" data-preset="pyoko">ぴょこぴょこ</button>
      </div>
    </div>

    <div class="group">
      <h2>3. 細かい調整(組み合わせ自由)</h2>
      <div class="row"><label>浮遊(上下ゆれ)</label><span class="val" id="floatVal">14px</span></div>
      <input type="range" id="float" min="0" max="40" step="1" value="14">
      <div class="row"><label>ゆれ(左右かたむき)</label><span class="val" id="swayVal">3°</span></div>
      <input type="range" id="sway" min="0" max="15" step="0.5" value="3">
      <div class="row"><label>呼吸(伸び縮み)</label><span class="val" id="breathVal">0%</span></div>
      <input type="range" id="breath" min="0" max="8" step="0.5" value="0">
      <div class="row"><label>跳ね</label><span class="val" id="hopVal">0px</span></div>
      <input type="range" id="hop" min="0" max="60" step="1" value="0">
      <div class="row"><label>ぷるぷる</label><span class="val" id="jitterVal">0px</span></div>
      <input type="range" id="jitter" min="0" max="6" step="0.5" value="0">
      <div class="row"><label>ループ周期</label><span class="val" id="periodVal">3.0秒</span></div>
      <input type="range" id="period" min="0.4" max="5" step="0.1" value="3">
      <div class="row"><label>なめらかさ</label><span class="val" id="fpsVal">15fps</span></div>
      <input type="range" id="fps" min="6" max="30" step="1" value="15">
    </div>

    <div class="group">
      <h2>4. 出力の設定</h2>
      <div class="row">
        <label>背景</label>
        <select id="bgMode">
          <option value="transparent">透過</option>
          <option value="white">白</option>
          <option value="black">黒</option>
          <option value="custom">カスタム色</option>
        </select>
      </div>
      <div class="row" id="bgColorRow" style="display:none">
        <label>背景色</label>
        <input type="color" id="bgColor" value="#ffffff">
      </div>
      <div class="row">
        <label>読込サイズ上限</label>
        <select id="maxSize">
          <option value="800">長辺 800px</option>
          <option value="0">元のサイズ</option>
          <option value="1280">長辺 1280px</option>
          <option value="480">長辺 480px</option>
        </select>
      </div>
    </div>

    <div class="group">
      <h2>5. 書き出し</h2>
      <button id="gifBtn" class="blue" disabled>GIF を書き出す</button>
      <button id="mp4Btn" class="green" disabled>MP4 動画を書き出す</button>
      <button id="webmBtn" class="green" disabled>WebM 動画を書き出す</button>
      <button id="zipBtn" class="secondary" disabled>連番PNG (ZIP) を書き出す</button>
      <div id="status"></div>
    </div>
  </div>

  <div id="right">
    <div id="previewWrap">
      <span id="emptyMsg">← 画像を読み込むとここでプレビューが動きます</span>
      <canvas id="preview" style="display:none"></canvas>
    </div>
    <div id="result">
      <img id="resultImg" alt="書き出し結果">
      <video id="resultVideo" autoplay muted loop playsinline style="display:none"></video>
      <div class="info" id="resultInfo"></div>
    </div>
  </div>
</main>

<script src="gifenc.js"></script>
<script src="lib/gifenc-lib.js"></script>
<script src="lib/mp4-muxer.js"></script>
<script src="lib/jszip.min.js"></script>
<script src="exporter.js"></script>
<script>
"use strict";

let srcImage = null;   // 読み込んだ元画像
let srcCanvas = null;  // 前処理済み(透過化・リサイズ)canvas
let frames = [];       // 生成済みフレーム canvas[]
const $ = (id) => document.getElementById(id);
const preview = $("preview");
const pctx = preview.getContext("2d");

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---------- 画像読み込み ----------
function loadFile(file) {
  if (!file || !file.type.startsWith("image/")) return;
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    URL.revokeObjectURL(url);
    srcImage = img;
    autoDetectAlpha();
    rebuildSource();
  };
  img.onerror = () => { URL.revokeObjectURL(url); ExportKit.setStatus("画像を読み込めませんでした"); };
  img.src = url;
}

function autoDetectAlpha() {
  const c = document.createElement("canvas");
  const s = Math.min(1, 256 / Math.max(srcImage.width, srcImage.height));
  c.width = Math.max(1, Math.round(srcImage.width * s));
  c.height = Math.max(1, Math.round(srcImage.height * s));
  const x = c.getContext("2d", { willReadFrequently: true });
  x.drawImage(srcImage, 0, 0, c.width, c.height);
  const d = x.getImageData(0, 0, c.width, c.height).data;
  let hasAlpha = false;
  for (let i = 3; i < d.length; i += 40) {
    if (d[i] < 250) { hasAlpha = true; break; }
  }
  $("whiteToAlpha").checked = !hasAlpha;
}

function whiteToAlpha(imgData) {
  const d = imgData.data;
  for (let i = 0; i < d.length; i += 4) {
    const r = d[i], g = d[i + 1], b = d[i + 2];
    const a = Math.max(255 - r, 255 - g, 255 - b);
    if (a === 0) { d[i + 3] = 0; continue; }
    d[i]     = 255 - ((255 - r) * 255) / a;
    d[i + 1] = 255 - ((255 - g) * 255) / a;
    d[i + 2] = 255 - ((255 - b) * 255) / a;
    d[i + 3] = (d[i + 3] * a) / 255;
  }
}

function rebuildSource() {
  if (!srcImage) return;
  let w = srcImage.width, h = srcImage.height;
  const limit = parseInt($("maxSize").value, 10);
  if (limit > 0 && Math.max(w, h) > limit) {
    const s = limit / Math.max(w, h);
    w = Math.max(1, Math.round(w * s));
    h = Math.max(1, Math.round(h * s));
  }
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const x = c.getContext("2d", { willReadFrequently: true });
  x.imageSmoothingQuality = "high";
  x.drawImage(srcImage, 0, 0, w, h);
  if ($("whiteToAlpha").checked) {
    const data = x.getImageData(0, 0, w, h);
    whiteToAlpha(data);
    x.putImageData(data, 0, 0);
  }
  srcCanvas = c;
  buildFrames();
}

// ---------- モーションフレーム生成 ----------
function params() {
  return {
    float: parseFloat($("float").value),
    sway: parseFloat($("sway").value),
    breath: parseFloat($("breath").value),
    hop: parseFloat($("hop").value),
    jitter: parseFloat($("jitter").value),
    period: parseFloat($("period").value),
    fps: parseInt($("fps").value, 10),
  };
}

function buildFrames() {
  if (!srcCanvas) return;
  const p = params();
  const N = Math.min(150, Math.max(2, Math.round(p.period * p.fps)));
  const sw = srcCanvas.width, sh = srcCanvas.height;
  const swayRad = (p.sway * Math.PI) / 180;
  const breathS = p.breath / 100;
  // どの変形でもはみ出さない余白を確保
  const margin = Math.ceil(
    p.float + p.hop + p.jitter + Math.sin(swayRad) * sh +
    sw * (breathS * 0.6 + 0.15) + 8
  );
  const W = sw + margin * 2, H = sh + margin * 2;
  const anchorX = W / 2, anchorY = margin + sh; // 足元(下端中央)基準

  const newFrames = [];
  for (let f = 0; f < N; f++) {
    const t = f / N;
    const ph = 2 * Math.PI * t;
    const rng = mulberry32(9000 + f * 31);

    const floatDy = -p.float * Math.sin(ph);
    const swayRot = swayRad * Math.sin(ph);
    let sy = 1 + breathS * Math.sin(ph);
    let sx = 1 - breathS * 0.6 * Math.sin(ph);
    let hopDy = 0;
    if (p.hop > 0) {
      const h = p.hop * Math.abs(Math.sin(ph)); // 1ループに2跳ね
      hopDy = -h;
      // 着地時につぶれて跳びで伸びる(スクワッシュ&ストレッチ)
      const ground = 1 - Math.min(1, h / (p.hop * 0.3));
      sy *= 1 - 0.13 * ground;
      sx *= 1 + 0.10 * ground;
    }
    const jx = (rng() - 0.5) * 2 * p.jitter;
    const jy = (rng() - 0.5) * 2 * p.jitter;

    const cv = document.createElement("canvas");
    cv.width = W; cv.height = H;
    const cx = cv.getContext("2d");
    cx.save();
    cx.translate(anchorX + jx, anchorY + floatDy + hopDy + jy);
    cx.rotate(swayRot);
    cx.scale(sx, sy);
    cx.drawImage(srcCanvas, -sw / 2, -sh);
    cx.restore();
    newFrames.push(cv);
  }
  frames = newFrames;
  preview.width = W;
  preview.height = H;
  preview.style.display = "";
  $("emptyMsg").style.display = "none";
  for (const id of ["gifBtn", "webmBtn", "zipBtn"]) $(id).disabled = false;
  if ("VideoEncoder" in window) $("mp4Btn").disabled = false;
  else $("mp4Btn").title = "このブラウザはWebCodecs非対応です";
  ExportKit.setStatus(`${W}×${H} / ${N}コマ(${p.period}秒ループ)生成完了`);
}

// ---------- プレビュー ----------
function currentBg() {
  const mode = $("bgMode").value;
  if (mode === "white") return [255, 255, 255];
  if (mode === "black") return [0, 0, 0];
  if (mode === "custom") {
    const hex = $("bgColor").value;
    return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
  }
  return null;
}

function tick(t) {
  if (frames.length > 0) {
    const fps = parseInt($("fps").value, 10);
    const idx = Math.floor((t / 1000) * fps) % frames.length;
    pctx.clearRect(0, 0, preview.width, preview.height);
    const bg = currentBg();
    if (bg) {
      pctx.fillStyle = `rgb(${bg[0]},${bg[1]},${bg[2]})`;
      pctx.fillRect(0, 0, preview.width, preview.height);
    }
    pctx.drawImage(frames[idx], 0, 0);
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

// ---------- サンプルキャラ ----------
function loadSample() {
  const c = document.createElement("canvas");
  c.width = 300; c.height = 300;
  const x = c.getContext("2d");
  // 大福っぽいマスコット
  x.fillStyle = "#fff3ea";
  x.strokeStyle = "#3a2f2a";
  x.lineWidth = 5;
  x.beginPath();
  x.moveTo(60, 250);
  x.bezierCurveTo(20, 250, 30, 120, 90, 90);
  x.bezierCurveTo(120, 40, 180, 40, 210, 90);
  x.bezierCurveTo(270, 120, 280, 250, 240, 250);
  x.closePath();
  x.fill();
  x.stroke();
  // 目
  x.fillStyle = "#3a2f2a";
  x.beginPath(); x.arc(115, 160, 9, 0, Math.PI * 2); x.fill();
  x.beginPath(); x.arc(185, 160, 9, 0, Math.PI * 2); x.fill();
  // 口
  x.lineWidth = 4;
  x.beginPath(); x.arc(150, 180, 16, 0.25 * Math.PI, 0.75 * Math.PI); x.stroke();
  // ほっぺ
  x.fillStyle = "rgba(255,150,150,0.55)";
  x.beginPath(); x.ellipse(95, 190, 13, 8, 0, 0, Math.PI * 2); x.fill();
  x.beginPath(); x.ellipse(205, 190, 13, 8, 0, 0, Math.PI * 2); x.fill();

  const img = new Image();
  img.onload = () => {
    srcImage = img;
    $("whiteToAlpha").checked = false;
    rebuildSource();
  };
  img.src = c.toDataURL();
}

// ---------- プリセット ----------
const PRESETS = {
  fuwa:   { float: 14, sway: 3,   breath: 0, hop: 0,  jitter: 0, period: 3,   fps: 15 },
  breath: { float: 2,  sway: 1.5, breath: 3, hop: 0,  jitter: 0, period: 3.5, fps: 15 },
  puru:   { float: 0,  sway: 0,   breath: 0, hop: 0,  jitter: 3, period: 0.6, fps: 20 },
  pyoko:  { float: 0,  sway: 2,   breath: 0, hop: 28, jitter: 0, period: 1.4, fps: 20 },
};
function applyPreset(name) {
  const p = PRESETS[name];
  for (const k of Object.keys(p)) {
    $(k).value = p[k];
  }
  syncLabels();
  buildFrames();
}

// ---------- イベント ----------
function syncLabels() {
  $("floatVal").textContent = $("float").value + "px";
  $("swayVal").textContent = $("sway").value + "°";
  $("breathVal").textContent = $("breath").value + "%";
  $("hopVal").textContent = $("hop").value + "px";
  $("jitterVal").textContent = $("jitter").value + "px";
  $("periodVal").textContent = parseFloat($("period").value).toFixed(1) + "秒";
  $("fpsVal").textContent = $("fps").value + "fps";
}

$("dropzone").addEventListener("click", () => $("fileInput").click());
$("fileInput").addEventListener("change", (e) => loadFile(e.target.files[0]));
$("sampleBtn").addEventListener("click", loadSample);
document.querySelectorAll("[data-preset]").forEach((b) =>
  b.addEventListener("click", () => applyPreset(b.dataset.preset))
);

const dz = $("dropzone");
document.addEventListener("dragover", (e) => { e.preventDefault(); dz.classList.add("hover"); });
document.addEventListener("dragleave", () => dz.classList.remove("hover"));
document.addEventListener("drop", (e) => {
  e.preventDefault();
  dz.classList.remove("hover");
  if (e.dataTransfer.files.length > 0) loadFile(e.dataTransfer.files[0]);
});
document.addEventListener("paste", (e) => {
  for (const item of e.clipboardData.items) {
    if (item.type.startsWith("image/")) { loadFile(item.getAsFile()); break; }
  }
});

let regenTimer = null;
for (const id of ["float", "sway", "breath", "hop", "jitter", "period", "fps"]) {
  $(id).addEventListener("input", () => {
    syncLabels();
    clearTimeout(regenTimer);
    regenTimer = setTimeout(buildFrames, 150);
  });
}
$("whiteToAlpha").addEventListener("change", rebuildSource);
$("maxSize").addEventListener("change", rebuildSource);
$("bgMode").addEventListener("change", () => {
  $("bgColorRow").style.display = $("bgMode").value === "custom" ? "" : "none";
});

$("gifBtn").addEventListener("click", () => ExportKit.exportGIF(frames, params().fps, currentBg()));
$("mp4Btn").addEventListener("click", () => ExportKit.exportMP4(frames, params().fps, currentBg()));
$("webmBtn").addEventListener("click", () => ExportKit.exportWebM(frames, params().fps, currentBg()));
$("zipBtn").addEventListener("click", () => ExportKit.exportZIP(frames, params().fps, currentBg()));
syncLabels();
</script>
</body>
</html>
