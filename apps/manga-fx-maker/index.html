<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manga FX Maker - 動く集中線・漫符オーバーレイ素材メーカー</title>
<style>
  :root {
    --bg: #16181d;
    --panel: #1f232b;
    --panel2: #262b35;
    --text: #e8eaf0;
    --sub: #9aa3b2;
    --accent: #e85fa8;
    --accent2: #6ee7a0;
    --border: #333a46;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Segoe UI", "Yu Gothic UI", "Meiryo", sans-serif;
    height: 100vh; display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    padding: 10px 18px; background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: baseline; gap: 14px;
  }
  header h1 { font-size: 17px; font-weight: 600; }
  header .desc { font-size: 12px; color: var(--sub); }
  main { flex: 1; display: flex; min-height: 0; }
  #panel {
    width: 300px; min-width: 300px; background: var(--panel);
    border-right: 1px solid var(--border); padding: 14px;
    overflow-y: auto; display: flex; flex-direction: column; gap: 14px;
  }
  .group {
    background: var(--panel2); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .group h2 { font-size: 12px; color: var(--sub); font-weight: 600; letter-spacing: 0.05em; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .row label { font-size: 12.5px; }
  .row .val { font-size: 12px; color: var(--accent); min-width: 46px; text-align: right; font-variant-numeric: tabular-nums; }
  input[type="range"] { width: 100%; accent-color: var(--accent); }
  select, input[type="color"], input[type="text"], input[type="number"] {
    background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 5px;
    padding: 4px 6px; font-size: 12.5px;
  }
  input[type="text"] { width: 110px; }
  input[type="number"] { width: 70px; }
  .types { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .types button { padding: 8px 4px; font-size: 12px; }
  .types button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  button {
    background: var(--accent); color: #fff; border: none; border-radius: 6px;
    padding: 9px 12px; font-size: 13.5px; font-weight: 600; cursor: pointer;
    transition: filter 0.15s;
  }
  button:hover:not(:disabled) { filter: brightness(1.12); }
  button:disabled { opacity: 0.4; cursor: default; }
  button.secondary { background: var(--panel2); border: 1px solid var(--border); color: var(--text); }
  button.green { background: #2e9e63; }
  button.blue { background: #4f8cff; }
  #status { font-size: 12px; color: var(--sub); min-height: 17px; }
  #right { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #previewWrap {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 20px; min-height: 0; position: relative;
  }
  #preview {
    max-width: 100%; max-height: 100%;
    border: 1px solid var(--border); border-radius: 4px;
    background: repeating-conic-gradient(#3a4150 0% 25%, #2b303b 0% 50%) 0 0 / 20px 20px;
  }
  #result {
    border-top: 1px solid var(--border); background: var(--panel);
    padding: 10px 18px; display: none; align-items: center; gap: 16px; max-height: 180px;
  }
  #result.show { display: flex; }
  #result img, #result video {
    max-height: 140px; max-width: 300px;
    border: 1px solid var(--border); border-radius: 4px;
    background: repeating-conic-gradient(#3a4150 0% 25%, #2b303b 0% 50%) 0 0 / 16px 16px;
  }
  #result .info { font-size: 12.5px; color: var(--sub); line-height: 1.8; }
  #result .info b { color: var(--accent2); }
  #result a { color: #4f8cff; }
</style>
</head>
<body>
<header>
  <h1>Manga FX Maker</h1>
  <span class="desc">手描き風に揺れる集中線・流線・漫符の透過アニメ素材を GIF / MP4 / WebM / 連番PNG で書き出せます(配信・動画のツッコミ演出に)</span>
</header>
<main>
  <div id="panel">
    <div class="group">
      <h2>1. エフェクトの種類</h2>
      <div class="types">
        <button class="secondary" data-type="focus">集中線</button>
        <button class="secondary" data-type="speed">流線(スピード線)</button>
        <button class="secondary" data-type="anger">怒りマーク</button>
        <button class="secondary" data-type="sweat">汗マーク</button>
        <button class="secondary" data-type="text">文字(!? 等)</button>
        <button class="secondary" data-type="moya">もやもや</button>
      </div>
    </div>

    <div class="group">
      <h2>2. サイズ・色</h2>
      <div class="row">
        <label>キャンバス</label>
        <select id="sizePreset">
          <option value="1280x720">1280×720 (16:9)</option>
          <option value="1920x1080">1920×1080 (16:9)</option>
          <option value="800x800" selected>800×800 (正方形)</option>
          <option value="400x400">400×400 (正方形)</option>
        </select>
      </div>
      <div class="row"><label>色</label><input type="color" id="color" value="#1a1a1a"></div>
    </div>

    <div class="group" id="typeParams">
      <h2>3. 調整</h2>
      <!-- 集中線 -->
      <div class="tp" data-for="focus speed">
        <div class="row"><label>線の本数</label><span class="val" id="countVal">70</span></div>
        <input type="range" id="count" min="10" max="200" step="5" value="70">
      </div>
      <div class="tp" data-for="focus">
        <div class="row"><label>中心の空き</label><span class="val" id="holeVal">35%</span></div>
        <input type="range" id="hole" min="10" max="70" step="1" value="35">
      </div>
      <div class="tp" data-for="speed">
        <div class="row">
          <label>向き</label>
          <select id="speedDir">
            <option value="rtl">右 → 左</option>
            <option value="ltr">左 → 右</option>
            <option value="ttb">上 → 下</option>
          </select>
        </div>
      </div>
      <div class="tp" data-for="text">
        <div class="row"><label>文字</label><input type="text" id="fxText" value="!?"></div>
      </div>
      <div class="tp" data-for="anger sweat text moya">
        <div class="row"><label>大きさ</label><span class="val" id="markSizeVal">60%</span></div>
        <input type="range" id="markSize" min="20" max="100" step="5" value="60">
      </div>
      <div class="tp" data-for="focus speed anger sweat moya">
        <div class="row"><label>線の太さ</label><span class="val" id="lineWVal">1.0x</span></div>
        <input type="range" id="lineW" min="0.4" max="3" step="0.1" value="1">
      </div>
      <div class="row"><label>揺れの強さ(手描き感)</label><span class="val" id="wobbleVal">1.0x</span></div>
      <input type="range" id="wobble" min="0" max="3" step="0.1" value="1">
      <div class="row"><label>コマ数(描き直し枚数)</label><span class="val" id="framesNVal">3</span></div>
      <input type="range" id="framesN" min="2" max="8" step="1" value="3">
      <div class="row"><label>再生速度</label><span class="val" id="fpsVal">10fps</span></div>
      <input type="range" id="fps" min="4" max="30" step="1" value="10">
      <button class="secondary" id="reseedBtn">配置をシャッフル</button>
    </div>

    <div class="group">
      <h2>4. 出力の設定</h2>
      <div class="row">
        <label>背景</label>
        <select id="bgMode">
          <option value="transparent">透過</option>
          <option value="white">白</option>
          <option value="black">黒</option>
          <option value="custom">カスタム色</option>
        </select>
      </div>
      <div class="row" id="bgColorRow" style="display:none">
        <label>背景色</label>
        <input type="color" id="bgColor" value="#ffffff">
      </div>
    </div>

    <div class="group">
      <h2>5. 書き出し</h2>
      <button id="gifBtn" class="blue">GIF を書き出す</button>
      <button id="mp4Btn" class="green">MP4 動画を書き出す</button>
      <button id="webmBtn" class="green">WebM 動画を書き出す</button>
      <button id="zipBtn" class="secondary">連番PNG (ZIP) を書き出す</button>
      <div id="status"></div>
    </div>
  </div>

  <div id="right">
    <div id="previewWrap">
      <canvas id="preview"></canvas>
    </div>
    <div id="result">
      <img id="resultImg" alt="書き出し結果">
      <video id="resultVideo" autoplay muted loop playsinline style="display:none"></video>
      <div class="info" id="resultInfo"></div>
    </div>
  </div>
</main>

<script src="gifenc.js"></script>
<script src="lib/gifenc-lib.js"></script>
<script src="lib/mp4-muxer.js"></script>
<script src="lib/jszip.min.js"></script>
<script src="exporter.js"></script>
<script>
"use strict";

let fxType = "focus";
let frames = [];
let layoutSeed = 1234; // 配置用シード(シャッフルで変更)
const $ = (id) => document.getElementById(id);
const preview = $("preview");
const pctx = preview.getContext("2d");

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function params() {
  const [w, h] = $("sizePreset").value.split("x").map(Number);
  return {
    W: w, H: h,
    color: $("color").value,
    count: parseInt($("count").value, 10),
    hole: parseInt($("hole").value, 10) / 100,
    speedDir: $("speedDir").value,
    text: $("fxText").value || "!?",
    markSize: parseInt($("markSize").value, 10) / 100,
    lineW: parseFloat($("lineW").value),
    wobble: parseFloat($("wobble").value),
    N: parseInt($("framesN").value, 10),
    fps: parseInt($("fps").value, 10),
  };
}

// ---------- 各エフェクトの描画 ----------
// layoutRng: 配置(全コマ共通) / wobRng: コマごとの揺れ
function drawFocusLines(cx, p, layoutRng, wobRng) {
  const { W, H } = p;
  const cxr = W / 2, cyr = H / 2;
  const maxR = Math.hypot(W, H) / 2 + 10;
  const holeR = Math.min(W, H) * 0.5 * p.hole;
  cx.fillStyle = p.color;
  for (let i = 0; i < p.count; i++) {
    const th = layoutRng() * Math.PI * 2 + (wobRng() - 0.5) * 0.015 * p.wobble;
    const halfW = (0.5 + layoutRng() * 2.2) * p.lineW * (Math.min(W, H) / 250);
    const inner = holeR * (0.85 + layoutRng() * 0.5) * (1 + (wobRng() - 0.5) * 0.12 * p.wobble);
    const dx = Math.cos(th), dy = Math.sin(th);
    const px = -dy, py = dx;
    cx.beginPath();
    cx.moveTo(cxr + dx * maxR + px * halfW, cyr + dy * maxR + py * halfW);
    cx.lineTo(cxr + dx * maxR - px * halfW, cyr + dy * maxR - py * halfW);
    cx.lineTo(cxr + dx * inner, cyr + dy * inner);
    cx.closePath();
    cx.fill();
  }
}

function drawSpeedLines(cx, p, layoutRng, wobRng) {
  const { W, H } = p;
  const vertical = p.speedDir === "ttb";
  const flip = p.speedDir === "ltr";
  cx.fillStyle = p.color;
  for (let i = 0; i < p.count; i++) {
    const pos = layoutRng() * (vertical ? W : H);
    const len = (0.25 + layoutRng() * 0.65) * (vertical ? H : W) * (1 + (wobRng() - 0.5) * 0.15 * p.wobble);
    const start = layoutRng() * ((vertical ? H : W) - len) + (wobRng() - 0.5) * 14 * p.wobble;
    const halfW = (0.4 + layoutRng() * 1.6) * p.lineW * (Math.min(W, H) / 250);
    const wob = (wobRng() - 0.5) * 4 * p.wobble;
    cx.beginPath();
    if (vertical) {
      cx.moveTo(pos - halfW + wob, start);
      cx.lineTo(pos + halfW + wob, start);
      cx.lineTo(pos + wob, start + len);
    } else if (flip) {
      cx.moveTo(start, pos - halfW + wob);
      cx.lineTo(start, pos + halfW + wob);
      cx.lineTo(start + len, pos + wob);
    } else {
      const x0 = W - start;
      cx.moveTo(x0, pos - halfW + wob);
      cx.lineTo(x0, pos + halfW + wob);
      cx.lineTo(x0 - len, pos + wob);
    }
    cx.closePath();
    cx.fill();
  }
}

function drawAnger(cx, p, layoutRng, wobRng) {
  const { W, H } = p;
  const s = Math.min(W, H) * p.markSize * 0.5; // マーク半径
  const cxr = W / 2, cyr = H / 2;
  cx.strokeStyle = p.color;
  cx.lineWidth = Math.max(2, s * 0.13 * p.lineW);
  cx.lineCap = "round";
  const wob = () => (wobRng() - 0.5) * s * 0.06 * p.wobble;
  // 4方向の「ぷくっ」とした山を十字に描く(定番の怒りマーク)
  for (let k = 0; k < 4; k++) {
    const a = (k * Math.PI) / 2 + Math.PI / 4;
    const ca = Math.cos(a), sa = Math.sin(a);
    // 内側の2点をつなぐ丸い山(💢の1要素)
    const spread = 0.62;
    const a1 = a - spread, a2 = a + spread;
    const r0 = s * 0.5;
    const x1 = cxr + Math.cos(a1) * r0 + wob(), y1 = cyr + Math.sin(a1) * r0 + wob();
    const x2 = cxr + Math.cos(a2) * r0 + wob(), y2 = cyr + Math.sin(a2) * r0 + wob();
    cx.beginPath();
    cx.moveTo(x1, y1);
    cx.quadraticCurveTo(cxr + ca * s * 1.75 + wob(), cyr + sa * s * 1.75 + wob(), x2, y2);
    cx.stroke();
  }
}

function drawSweat(cx, p, layoutRng, wobRng) {
  const { W, H } = p;
  const s = Math.min(W, H) * p.markSize * 0.45;
  const cxr = W / 2, cyr = H / 2;
  const wob = () => (wobRng() - 0.5) * s * 0.05 * p.wobble;
  cx.strokeStyle = p.color;
  cx.fillStyle = "rgba(120,190,255,0.55)";
  cx.lineWidth = Math.max(2, s * 0.07 * p.lineW);
  cx.lineJoin = "round";
  // しずく形(上が尖り、下が丸い)を少し傾けて描く
  cx.save();
  cx.translate(cxr, cyr);
  cx.rotate(0.25 + (wobRng() - 0.5) * 0.06 * p.wobble);
  cx.beginPath();
  cx.moveTo(0 + wob(), -s + wob());
  cx.bezierCurveTo(s * 0.55 + wob(), -s * 0.25, s * 0.62 + wob(), s * 0.35, 0 + wob(), s * 0.62 + wob());
  cx.bezierCurveTo(-s * 0.62 + wob(), s * 0.35, -s * 0.55 + wob(), -s * 0.25, 0 + wob(), -s + wob());
  cx.closePath();
  cx.fill();
  cx.stroke();
  // ハイライト
  cx.beginPath();
  cx.arc(-s * 0.18, s * 0.18, s * 0.2, Math.PI * 0.6, Math.PI * 1.1);
  cx.stroke();
  cx.restore();
}

function drawText(cx, p, layoutRng, wobRng) {
  const { W, H } = p;
  const size = Math.min(W, H) * p.markSize * 0.8;
  cx.save();
  cx.translate(W / 2 + (wobRng() - 0.5) * 8 * p.wobble, H / 2 + (wobRng() - 0.5) * 8 * p.wobble);
  cx.rotate((wobRng() - 0.5) * 0.05 * p.wobble);
  cx.font = `900 ${size}px "Yu Gothic UI", "Meiryo", sans-serif`;
  cx.textAlign = "center";
  cx.textBaseline = "middle";
  cx.lineJoin = "round";
  cx.strokeStyle = "#ffffff";
  cx.lineWidth = size * 0.09;
  cx.strokeText(p.text, 0, 0);
  cx.fillStyle = p.color;
  cx.fillText(p.text, 0, 0);
  cx.restore();
}

function drawMoya(cx, p, layoutRng, wobRng) {
  const { W, H } = p;
  const s = Math.min(W, H) * p.markSize * 0.5;
  const cxr = W / 2, cyr = H / 2;
  cx.strokeStyle = p.color;
  cx.lineWidth = Math.max(2, s * 0.06 * p.lineW);
  cx.lineCap = "round";
  // ぐるぐる渦巻き(もやもや)
  cx.beginPath();
  const turns = 3.2;
  const steps = 120;
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const a = t * turns * Math.PI * 2 + layoutRng() * 0; // 開始角固定
    const r = s * (0.12 + t * 0.88) * (1 + (wobRng() - 0.5) * 0.06 * p.wobble);
    const x = cxr + Math.cos(a) * r * 1.15 + (wobRng() - 0.5) * 2.5 * p.wobble;
    const y = cyr + Math.sin(a) * r * 0.85 + (wobRng() - 0.5) * 2.5 * p.wobble;
    if (i === 0) cx.moveTo(x, y);
    else cx.lineTo(x, y);
  }
  cx.stroke();
}

const DRAWERS = {
  focus: drawFocusLines,
  speed: drawSpeedLines,
  anger: drawAnger,
  sweat: drawSweat,
  text: drawText,
  moya: drawMoya,
};

// ---------- フレーム生成 ----------
function buildFrames() {
  const p = params();
  const newFrames = [];
  for (let f = 0; f < p.N; f++) {
    const cv = document.createElement("canvas");
    cv.width = p.W; cv.height = p.H;
    const cx = cv.getContext("2d");
    // 配置は全コマ同じシード、揺れはコマごとに別シード → 「同じ絵の描き直し」に見える
    DRAWERS[fxType](cx, p, mulberry32(layoutSeed), mulberry32(layoutSeed * 7 + f * 131 + 1));
    newFrames.push(cv);
  }
  frames = newFrames;
  preview.width = p.W;
  preview.height = p.H;
  ExportKit.setStatus(`${p.W}×${p.H} / ${fxType} / ${p.N}コマ 生成完了`);
}

// ---------- プレビュー ----------
function currentBg() {
  const mode = $("bgMode").value;
  if (mode === "white") return [255, 255, 255];
  if (mode === "black") return [0, 0, 0];
  if (mode === "custom") {
    const hex = $("bgColor").value;
    return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
  }
  return null;
}

function tick(t) {
  if (frames.length > 0) {
    const fps = parseInt($("fps").value, 10);
    const idx = Math.floor((t / 1000) * fps) % frames.length;
    pctx.clearRect(0, 0, preview.width, preview.height);
    const bg = currentBg();
    if (bg) {
      pctx.fillStyle = `rgb(${bg[0]},${bg[1]},${bg[2]})`;
      pctx.fillRect(0, 0, preview.width, preview.height);
    }
    pctx.drawImage(frames[idx], 0, 0);
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

// ---------- イベント ----------
function updateTypeUI() {
  document.querySelectorAll(".types button").forEach((b) =>
    b.classList.toggle("active", b.dataset.type === fxType)
  );
  document.querySelectorAll(".tp").forEach((el) => {
    el.style.display = el.dataset.for.split(" ").includes(fxType) ? "" : "none";
  });
}
document.querySelectorAll(".types button").forEach((b) =>
  b.addEventListener("click", () => {
    fxType = b.dataset.type;
    updateTypeUI();
    buildFrames();
  })
);

function syncLabels() {
  $("countVal").textContent = $("count").value;
  $("holeVal").textContent = $("hole").value + "%";
  $("markSizeVal").textContent = $("markSize").value + "%";
  $("lineWVal").textContent = parseFloat($("lineW").value).toFixed(1) + "x";
  $("wobbleVal").textContent = parseFloat($("wobble").value).toFixed(1) + "x";
  $("framesNVal").textContent = $("framesN").value;
  $("fpsVal").textContent = $("fps").value + "fps";
}

let regenTimer = null;
for (const id of ["count", "hole", "markSize", "lineW", "wobble", "framesN", "fps"]) {
  $(id).addEventListener("input", () => {
    syncLabels();
    clearTimeout(regenTimer);
    regenTimer = setTimeout(buildFrames, 120);
  });
}
for (const id of ["sizePreset", "color", "speedDir", "fxText"]) {
  $(id).addEventListener("input", () => { buildFrames(); });
}
$("reseedBtn").addEventListener("click", () => {
  layoutSeed = Math.floor(Math.random() * 1e9);
  buildFrames();
});
$("bgMode").addEventListener("change", () => {
  $("bgColorRow").style.display = $("bgMode").value === "custom" ? "" : "none";
});

$("gifBtn").addEventListener("click", () => ExportKit.exportGIF(frames, params().fps, currentBg()));
$("mp4Btn").addEventListener("click", () => ExportKit.exportMP4(frames, params().fps, currentBg()));
$("webmBtn").addEventListener("click", () => ExportKit.exportWebM(frames, params().fps, currentBg()));
$("zipBtn").addEventListener("click", () => ExportKit.exportZIP(frames, params().fps, currentBg()));
if (!("VideoEncoder" in window)) {
  $("mp4Btn").disabled = true;
  $("mp4Btn").title = "このブラウザはWebCodecs非対応です";
}

syncLabels();
updateTypeUI();
buildFrames();
</script>
</body>
</html>
